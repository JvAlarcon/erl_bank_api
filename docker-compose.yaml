services:
  postgres:
    image: postgres
    container_name: pg_bank_api
    volumes:
      - ./resources/bank_relations.sql:/docker-entrypoint-initdb.d/bank_relations.sql
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "dbpwd123!"
      POSTGRES_DB:
    ports:
      - "5532:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 10

  erl_bank_api:
    # build: . will search for any Dockerfile inside the directory
    build: .
    # The hostname inside docker network. Be sure to use this value in nginx.conf
    hostname: alarcon.bank
    image: erl_bank
    depends_on:
      - pg_bank_api

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - pg_bank_api
      - erl_bank_api
    links:
      - erl_bank_api

networks:
  default:
    driver: bridge
    name: bank_api
